name: Destroy Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clean Up SageMaker Endpoints and Endpoint Configurations
        run: |
          teams=("fraud-detection" "recommendations" "forecasting")

          for team in "${teams[@]}"; do
            ENDPOINT_NAME="stuart-assessment4-${team}-endpoint"
            CONFIG_NAME="stuart-assessment4-${team}-config"

            echo "Deleting Endpoint: ${ENDPOINT_NAME}"
            aws sagemaker delete-endpoint --endpoint-name "$ENDPOINT_NAME" || true

            echo "Deleting Endpoint Configuration: ${CONFIG_NAME}"
            aws sagemaker delete-endpoint-config --endpoint-config-name "$CONFIG_NAME" || true
          done    

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve