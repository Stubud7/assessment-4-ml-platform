name: Build and Deploy ML Services

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [neural-predictor, xgboost-predictor, anomaly-detector]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
          kubectl version --client

      - name: Create namespaces if not exist
        run: |
          kubectl apply -f k8s/neural-predictor/namespace.yml
          kubectl apply -f k8s/xgboost-predictor/namespace.yml
          kubectl apply -f k8s/anomaly-detector/namespace.yml

      - name: Deploy Neural Predictor
        run: |
          kubectl apply -f k8s/neural-predictor/configmap.yml
          kubectl apply -f k8s/neural-predictor/deployment.yml
          kubectl apply -f k8s/neural-predictor/service.yml

      - name: Deploy XGBoost Predictor
        run: |
          kubectl apply -f k8s/xgboost-predictor/configmap.yml
          kubectl apply -f k8s/xgboost-predictor/deployment.yml
          kubectl apply -f k8s/xgboost-predictor/service.yml

      - name: Deploy Anomaly Detector
        run: |
          kubectl apply -f k8s/anomaly-detector/configmap.yml
          kubectl apply -f k8s/anomaly-detector/deployment.yml
          kubectl apply -f k8s/anomaly-detector/service.yml

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/neural-predictor -n team-neural --timeout=5m
          kubectl rollout status deployment/xgboost-predictor -n team-xgboost --timeout=5m
          kubectl rollout status deployment/anomaly-detector -n team-anomaly --timeout=5m

      - name: Get service endpoints
        run: |
          echo "=== Neural Predictor ===" 
          kubectl get svc neural-predictor -n team-neural
          echo ""
          echo "=== XGBoost Predictor ==="
          kubectl get svc xgboost-predictor -n team-xgboost
          echo ""
          echo "=== Anomaly Detector ==="
          kubectl get svc anomaly-detector -n team-anomaly

      - name: Verify pod health
        run: |
          kubectl get pods -n team-neural
          kubectl get pods -n team-xgboost
          kubectl get pods -n team-anomaly
