name: Build and Deploy

on:
  push:
    branches: [main]
    workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: k8s-training-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: System information
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Available disk space:"
          df -h
          echo "Available memory:"
          free -h
          echo "CPU information:"
          nproc    

      - name: Free Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false


      # 2. Python Setup (From starter code)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install Python Dependencies (From starter code)
      - name: Install dependencies
        run: |
          pip install -r services/example/requirements.txt

        #4 N/A

        # 5. Build Docker Containers - SKIPPED
        # Built-in algorithms (Linear Learner, XGBoost, Factorization Machines) 
        # are hosted directly in AWS ECR, so local container builds are not required.

      # 6. N/A

      # 7. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.0

      # 8. Terraform Sequence (Init -> Validate -> Plan -> Apply)
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

       
      - name: Terraform Apply Infrastructure & Models
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: ./terraform
        run: terraform apply -auto-approve


      # 2. Trigger Endpoint Creation Asynchronously
      - name: Trigger SageMaker Endpoints Asynchronously
        run: |
          teams=("fraud-detection" "recommendations" "forecasting")

          for team in "${teams[@]}"; do
            ENDPOINT_NAME="stuart-assessment4-${team}-endpoint"
            CONFIG_NAME="stuart-assessment4-${team}-config"

            echo "Triggering asynchronous creation for: ${ENDPOINT_NAME}"

            # Kick off creation without waiting for completion
            aws sagemaker create-endpoint \
              --endpoint-name "$ENDPOINT_NAME" \
              --endpoint-config-name "$CONFIG_NAME" \
              --tags Key=Name,Value="$ENDPOINT_NAME" Key=Team,Value="$team" || true
          done

      # 3. Log Initial Status and Finish Job
      - name: Check Initial Endpoint Status
        run: |
          aws sagemaker list-endpoints --name-contains "stuart-assessment4"




      # -- Build and Push Team Microservices --
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Fraud Service
      - name: Build and push Fraud Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/fraud
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/fraud-service:latest
            ghcr.io/${{ github.actor }}/fraud-service:${{ github.sha }}

      # 2. Recommendations Service
      - name: Build and push Recommendations Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/recommendations
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/recommendations-service:latest
            ghcr.io/${{ github.actor }}/recommendations-service:${{ github.sha }}

      # 3. Forecasting Service
      - name: Build and push Forecasting Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/forecasting
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/forecasting-service:latest
            ghcr.io/${{ github.actor }}/forecasting-service:${{ github.sha }}

      # 4. Gateway Service (Bonus)
      - name: Build and push Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/gateway-service:latest
            ghcr.io/${{ github.actor }}/gateway-service:${{ github.sha }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Inject Kubernetes Secrets into Team Namespaces
        run: |
          TEAMS=("team-fraud-detection" "team-recommendations" "team-forecasting")

          for ns in "${TEAMS[@]}"; do
            echo "Applying secrets to namespace: $ns"

            # 1. Inject GHCR Image Pull Secret
            kubectl create secret docker-registry ghcr-secret \
              --namespace="$ns" \
              --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" \
              --docker-password="${{ secrets.GHCR_TOKEN }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            # 2. Inject AWS Credentials Secret
            kubectl create secret generic team-aws-credentials \
              --namespace="$ns" \
              --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done


      # -- Apply Kubernetes Manifests --
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ -R
      
      # -- Add kubectl apply steps per team here --

      - name: Verify Kubernetes Rollout & Pod Status
        run: |
          echo "=== Checking Rollout Status ==="
          kubectl rollout status deployment/example-service -n team-example --timeout=120s || true
          
          echo "=== Listing Running Pods ==="
          kubectl get pods -n team-example -o wide
          
          echo "=== Services and Endpoints ==="
          kubectl get svc,ep -n team-example
