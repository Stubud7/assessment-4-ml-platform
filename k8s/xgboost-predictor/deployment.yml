apiVersion: apps/v1
kind: Deployment
metadata:
  name: xgboost-predictor
  namespace: team-xgboost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xgboost-predictor
  template:
    metadata:
      labels:
        app: xgboost-predictor
        team: xgboost
    spec:
      containers:
        - name: xgboost-predictor
          image: ghcr.io/czarnick89/xgboost-predictor:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: xgboost-predictor-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      imagePullSecrets:
        - name: ghcr-secret
