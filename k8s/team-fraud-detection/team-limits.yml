apiVersion: v1
kind: LimitRange
metadata:
  name: team-fraud-detection-defaults # Use team-fraud-detection-defaults to describe the default resource policy.
  namespace: team-fraud-detection  # Use team-fraud-detection so these defaults apply inside the lab namespace.
spec:
  limits:
    - type: Container  # Applies these defaults to each container created in the namespace.
      defaultRequest:
        cpu: 100m  # Use 100m as the CPU request when a pod omits one.
        memory: 128Mi  # Use 128Mi as the memory request when a pod omits one.
      default:
        cpu: 500m  # Use 500m as the CPU limit when a pod omits one.
        memory: 512Mi  # Use 512Mi as the memory limit when a pod omits one.