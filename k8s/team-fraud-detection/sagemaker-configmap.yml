apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-config # Use fraud-config so the Pod can reference this ConfigMap by name.
  namespace: team-fraud-detection # Use team-fraud so the ConfigMap lives with the app workload.
data:
  ENDPOINT_NAME: "stuart-assessment4-fraud-detection-endpoint"  # Use xgboost for this lab's example endpoint setting
  AWS_REGION: "us-east-1"  # Use us-east-1 unless your instructor gives you a different Region.
  LOG_LEVEL: "info"  # Use info for normal runtime logging.