apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecasting-service
  namespace: team-forecasting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forecasting-service
  template:
    metadata:
      labels:
        app: forecasting-service
    spec:
      containers:
        - name: forecasting-api
          image: ghcr.io/stubud7/forecasting-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: forecasting-config
            - secretRef:
                name: team-aws-credentials 
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10         
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      imagePullSecrets:
        - name: ghcr-secret
